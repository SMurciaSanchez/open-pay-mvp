version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:14-alpine
    container_name: openpay_postgres
    environment:
      POSTGRES_USER: openpay
      POSTGRES_PASSWORD: openpay_password
      POSTGRES_DB: openpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for token management and caching
  redis:
    image: redis:alpine
    container_name: openpay_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: openpay_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - FLASK_APP=src.app:create_app
      - FLASK_ENV=development
      - DATABASE_URI=postgresql://openpay:openpay_password@postgres:5432/openpay
      - REDIS_HOST=redis
      - SECRET_KEY=development_secret_key_change_me
      - JWT_SECRET_KEY=development_jwt_key_change_me
    ports:
      - "5000:5000"
    volumes:
      - ./packages/api:/app
    command: flask run --host=0.0.0.0

  # Frontend web application
  web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    container_name: openpay_web
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    ports:
      - "3000:3000"
    volumes:
      - ./packages/web:/app
      - /app/node_modules
    command: npm run dev

  # MinIO for S3-compatible storage (for file uploads and KYC documents)
  minio:
    image: minio/minio
    container_name: openpay_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: openpay_minio
      MINIO_ROOT_PASSWORD: openpay_minio_password
    volumes:
      - minio_data:/data
    command: server --console-address ":9001" /data

  # Adminer for database management
  adminer:
    image: adminer
    container_name: openpay_adminer
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  minio_data: 